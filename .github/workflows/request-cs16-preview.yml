name: Request CS 1.6 preview v0.2.1
on:
  push:
    branches: ['codex/publish-cs16-v0.2.1']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.repository == 'skillmatic87/Counter-Strike-1.6-Steam-Server-Linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify main and dispatch the existing guarded release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 3d92653cb64251b2346bdc6779c100e974a5d15e
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq ".object.sha")" == "$EXPECTED_MAIN" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$EXPECTED_MAIN" --jq ".content" | base64 --decode)" == "0.2.1" ]]
          gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_release=true
