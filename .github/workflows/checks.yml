name: Installer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: node scripts/test_configurator.cjs
      - run: bash -n Setup-Linux.sh Start-Server.sh Start-Panel.sh
  linux-assembly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libgcc-s1:i386 libstdc++6:i386 zlib1g:i386
      - uses: actions/cache@v4
        with:
          path: downloads
          key: cs16-components-${{ hashFiles('scripts/components.json', 'content/pack.json') }}
      - run: python3 scripts/check_assembly.py --cache-directory downloads
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [unit, linux-assembly]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; keep it unchanged. Increment VERSION for another release."
            exit 0
          fi
          asset="Counter-Strike-1.6-Steam-Server-Linux-${version}.zip"
          git archive --format=zip --prefix=Counter-Strike-1.6-Steam-Server-Linux/ --output="$asset" HEAD
          sha256sum "$asset" > "${asset}.sha256"
          gh release create "$tag" "$asset" "${asset}.sha256" \
            --target "$GITHUB_SHA" --prerelease \
            --title "v${version} - Linux Mint preview" --notes-file CHANGELOG.md
